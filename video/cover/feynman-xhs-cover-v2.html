<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1440px;
    font-family: "Noto Serif SC", "Songti SC", serif;
    background: #1A2E26;
    position: relative;
    overflow: hidden;
  }
  .eyebrow {
    position: absolute;
    top: 80px;
    left: 90px;
    font-family: "Noto Sans SC", sans-serif;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 8px;
    color: #E9C46A;
  }
  .title {
    position: absolute;
    top: 160px;
    left: 90px;
    right: 90px;
  }
  .t1 {
    font-size: 96px;
    font-weight: 900;
    color: #F2EFE4;
    line-height: 1.3;
  }
  .strike { position: relative; white-space: nowrap; }
  .strike::after {
    content: "";
    position: absolute;
    left: -3%;
    top: 54%;
    width: 106%;
    height: 13px;
    background: #D64533;
    border-radius: 7px;
    transform: rotate(-1.5deg);
  }
  .t2 {
    margin-top: 30px;
    font-size: 82px;
    font-weight: 900;
    color: #E9C46A;
    line-height: 1.3;
  }
  .t2 em { font-style: normal; color: #D64533; }

  /* 纸张对话卡：贴在黑板上 */
  .card {
    position: absolute;
    top: 620px;
    left: 90px;
    right: 90px;
    background:
      repeating-linear-gradient(transparent 0, transparent 74px, #DDD6C2 74px, #DDD6C2 76px),
      linear-gradient(to right, transparent 0, transparent 90px, rgba(214,69,51,0.45) 90px, rgba(214,69,51,0.45) 92px, transparent 92px),
      #FBF8EF;
    border-radius: 12px;
    padding: 70px 60px 50px 130px;
    transform: rotate(-1.2deg);
    box-shadow: 14px 18px 0 rgba(0,0,0,0.35);
  }
  .tape {
    position: absolute;
    top: -42px;
    left: 50%;
    width: 300px;
    height: 80px;
    transform: translateX(-50%) rotate(-2deg);
    background: rgba(233,196,106,0.55);
    border-left: 2px dashed rgba(26,46,38,0.25);
    border-right: 2px dashed rgba(26,46,38,0.25);
  }
  .who {
    font-family: "Zhi Mang Xing", "Kaiti SC", cursive;
    font-size: 44px;
    color: #7FA08C;
  }
  .who.you { color: #1A2E26; }
  .msg {
    font-family: "Noto Sans SC", sans-serif;
    font-size: 40px;
    color: #1A2E26;
    line-height: 74px;
    margin-bottom: 14px;
  }
  .msg.ai { color: #3a4a42; }
  .circle {
    position: relative;
    font-weight: 700;
  }
  .circle::after {
    content: "";
    position: absolute;
    left: -24px;
    top: -16px;
    right: -24px;
    bottom: -16px;
    border: 6px solid #D64533;
    border-radius: 50%;
    transform: rotate(-2deg);
  }
  .hand {
    font-family: "Zhi Mang Xing", "Kaiti SC", cursive;
    font-size: 46px;
    color: #D64533;
    display: block;
    margin-top: 26px;
  }
  .bottom {
    position: absolute;
    bottom: 64px;
    left: 90px;
    right: 90px;
    display: flex;
    align-items: center;
    gap: 26px;
  }
  .logo {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    border: 4px solid #E9C46A;
    color: #E9C46A;
    display: grid;
    place-items: center;
    font-family: "Zhi Mang Xing", "Kaiti SC", cursive;
    font-size: 56px;
    transform: rotate(-6deg);
    flex-shrink: 0;
  }
  .brand {
    font-size: 44px;
    font-weight: 700;
    color: #F2EFE4;
    line-height: 1.35;
  }
  .brand small {
    display: block;
    font-size: 30px;
    font-weight: 400;
    color: #7FA08C;
    font-family: "Noto Sans SC", sans-serif;
  }
</style>
</head>
<body>
  <div class="eyebrow">一场真实的拷问 · 实录</div>
  <div class="title">
    <div class="t1">我<span class="strike">以为</span>我懂复利，</div>
    <div class="t2">直到 AI 问了我 <em>8</em> 个问题</div>
  </div>

  <div class="card">
    <div class="tape"></div>
    <div class="msg"><span class="who you">你</span>　利息按本金算，每年一样多</div>
    <div class="msg ai"><span class="who">听众</span>　<span class="circle">银行凭什么给你利息？</span></div>
    <span class="hand">盲区 +1：我以为的懂，只是眼熟</span>
  </div>

  <div class="bottom">
    <div class="logo">?</div>
    <div class="brand">费曼技巧 · AI 陪练<small>你讲它问，直到真懂</small></div>
  </div>
</body>
</html>
